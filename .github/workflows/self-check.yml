name: Cron self-check (watchdog)

on:
  schedule:
    # Ежедневно в 01:30 UTC (04:30 МСК) — РЕЗЕРВ сторожа. Основной запуск сторожа —
    # supercronic в 01:00 UTC (cron/crontab). Если крон-сайдкар не отработал (лежал
    # контейнер), GitHub-дублёр всё равно запустит проверку: сторож перезапустит
    # пропущенные джобы и пришлёт письмо на CRON_ALERT_EMAIL при неуспехе.
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cron self-check
        env:
          CRON_URL: ${{ secrets.CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "CRON_URL / CRON_SECRET не настроены в GitHub Secrets"
            exit 1
          fi
          response=$(curl -sS -w "\n%{http_code}" -X POST "$CRON_URL/api/cron/self-check" \
            -H "Authorization: Bearer $CRON_SECRET")
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)
          echo "HTTP $status"
          echo "$body"
          if [ "$status" != "200" ]; then
            exit 1
          fi
