name: Billing - generate invoices (daily)

on:
  schedule:
    # Ежедневно в 00:16 UTC (03:16 МСК). РЕЗЕРВ: supercronic. Legacy-подписки (день-якорь не задан)
    # выставляются только с 20-го — гейт внутри хендлера. Anchored-подписки
    # (Bug #65) выставляются за 10 дней до индивидуального срока оплаты, поэтому
    # крон должен работать каждый день. Прогоны идемпотентны.
    - cron: '16 0 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger billing-generate-invoices
        env:
          CRON_URL: ${{ secrets.CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "CRON_URL / CRON_SECRET не настроены в GitHub Secrets"
            exit 1
          fi
          response=$(curl -sS -w "\n%{http_code}" -X POST "$CRON_URL/api/cron/billing-generate-invoices" \
            -H "Authorization: Bearer $CRON_SECRET")
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)
          echo "HTTP $status"
          echo "$body"
          if [ "$status" != "200" ]; then
            exit 1
          fi
