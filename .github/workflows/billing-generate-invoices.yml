name: Billing - generate invoices (20th+)

on:
  schedule:
    # Ежедневно с 20-го по конец месяца в 06:00 UTC (~09:00 MSK):
    # 20-го — основное выставление счетов за следующий месяц, дальнейшие
    # прогоны идемпотентны (дозапуск после сбоев / заполнения ИНН).
    - cron: '0 6 20-31 * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger billing-generate-invoices
        env:
          CRON_URL: ${{ secrets.CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "CRON_URL / CRON_SECRET не настроены в GitHub Secrets"
            exit 1
          fi
          response=$(curl -sS -w "\n%{http_code}" -X POST "$CRON_URL/api/cron/billing-generate-invoices" \
            -H "Authorization: Bearer $CRON_SECRET")
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)
          echo "HTTP $status"
          echo "$body"
          if [ "$status" != "200" ]; then
            exit 1
          fi
