name: Deploy to dev

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'docker-compose.yml'
      - 'cron/**'
      - 'nginx/**'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:


# Две выкатки на один и тот же сервер одновременно ломают друг друга: docker
# compose переименовывает старый контейнер под замену, и параллельный compose up
# падает с «container name ... is already in use», а живым остаётся образ того
# рана, который дошёл до up последним. Наблюдали 19.08.2026 на msk1: пуш
# ea8a0cd4 стартовал, пока ещё катился f2b20b4c → ран упал, а на сервере осталась
# предыдущая сборка. Здесь та же схема деплоя — риск идентичен.
# Группа сериализует выкатки: новый пуш ждёт текущую. cancel-in-progress: false —
# прерывать деплой на полпути нельзя; GitHub сам отменит лишь ПРЕДЫДУЩИЙ
# ожидающий ран, так что из очереди выкатится самый свежий коммит (деплой и так
# делает git pull на актуальный main).
concurrency:
  group: deploy-hetzner-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        id: deploy
        uses: appleboy/ssh-action@v1
        env:
          # Прокидывается в окружение удалённого скрипта через envs ниже.
          # Если секрет в GitHub не задан — переменная придёт пустой, и блок
          # провижинга .env её просто пропустит (см. условие в script).
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Токен джоба: нужен, чтобы сервер тянул код аутентифицированно.
          # Отдельного секрета заводить не надо — GitHub выдаёт его сам.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: 65.108.45.153
          port: 2280
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: CRON_SECRET,GH_TOKEN
          script: |
            set -e  # любой провал шага = провал деплоя (раньше билд мог упасть, а up -d продолжал на старом образе)
            cd /opt/crmka
            # Тянем через АУТЕНТИФИЦИРОВАННЫЙ URL, а не анонимно.
            #
            # 31.08.2026 деплой встал на обоих серверах: «could not read Username
            # for https://github.com» и «expected flush after ref listing». Выглядит
            # как проблема доступа, но репозиторий публичный — GitHub отбивает
            # анонимные запросы с датацентровых IP. Проверено руками: одна и та же
            # команда то проходит, то нет, независимо от пользователя и оболочки,
            # поэтому одним повтором это не лечится.
            #
            # GITHUB_TOKEN живёт только на время джоба и в URL не сохраняется:
            # remote origin не трогаем, токен уходит одноразовым аргументом.
            # GIT_TERMINAL_PROMPT=0 — чтобы git не подменял сетевую ошибку
            # приглашением ввода логина и не висел без tty.
            for attempt in 1 2 3; do
              GIT_TERMINAL_PROMPT=0 git pull \
                "https://x-access-token:${GH_TOKEN}@github.com/denshimansky/crmka.git" main && break
              if [ "$attempt" = 3 ]; then echo "git pull не удался трижды"; exit 1; fi
              echo "git pull не удался (попытка $attempt) — повтор через 10с"
              sleep 10
            done
            # Гарантируем что dev-сервер имеет ALLOW_DESTRUCTIVE_API=true (для seed/reset)
            if ! grep -q "^ALLOW_DESTRUCTIVE_API=" .env 2>/dev/null; then
              echo "ALLOW_DESTRUCTIVE_API=true" >> .env
            fi
            # CRON_SECRET — если задан в GitHub Secrets и ещё не в .env, дописываем.
            # Перезалить старое значение скриптом сознательно не пытаемся: ротация
            # секрета — отдельная операция через sudo nano.
            if [ -n "${CRON_SECRET}" ] && ! grep -q "^CRON_SECRET=" .env 2>/dev/null; then
              echo "CRON_SECRET=${CRON_SECRET}" >> .env
            fi
            # Пре-билд-страховка от ENOSPC (инцидент 01.08.2026 на msk1): build cache
            # рос быстрее, чем пост-билд-очистка `until=168h` его снимала, и забивал
            # диск до 100%. `docker compose build` падал с ENOSPC под set -e, а шаг
            # очистки НИЖЕ уже не отрабатывал → самоблокировка деплоя. Чистим весь
            # build cache ДО сборки, если диск занят ≥75%. Образы и тома не трогаем.
            USED=$(df --output=pcent / | tail -1 | tr -dc '0-9')
            echo "Диск занят ${USED:-?}% до сборки"
            if [ "${USED:-0}" -ge 75 ]; then
              echo "≥75% — чистим весь build cache до сборки"
              docker builder prune -af || true
              df -h /
            fi
            docker compose build app cron
            # Убираем застрявшие переименованные контейнеры от прерванного прошлого
            # recreate (docker оставляет <hash>_crmka-<svc>-1 → следующий up конфликтует
            # «container name already in use»; баг повторился 23.07.2026, commit 4048e81).
            # Живые crmka-*-1 (без hex-префикса) не трогаем. Чистим ДО up + retry.
            cleanup_orphan_containers() {
              docker ps -a --format '{{.Names}}' | grep -E '^[0-9a-f]+_crmka-.+-[0-9]+$' | xargs -r docker rm -f || true
            }
            cleanup_orphan_containers
            if ! docker compose up -d; then
              echo "compose up упал — повторная чистка застрявших контейнеров и retry"
              cleanup_orphan_containers
              docker compose up -d
            fi
            # Baseline: если _prisma_migrations не существует, создаём и помечаем initial как applied
            docker compose exec -T db psql -U crmka -c "
              CREATE TABLE IF NOT EXISTS \"_prisma_migrations\" (
                id VARCHAR(36) PRIMARY KEY,
                checksum VARCHAR(64) NOT NULL,
                finished_at TIMESTAMPTZ,
                migration_name VARCHAR(255) NOT NULL,
                logs TEXT,
                rolled_back_at TIMESTAMPTZ,
                started_at TIMESTAMPTZ NOT NULL DEFAULT now(),
                applied_steps_count INTEGER NOT NULL DEFAULT 0
              );
              INSERT INTO \"_prisma_migrations\" (id, checksum, migration_name, finished_at, applied_steps_count)
              SELECT gen_random_uuid(), '', '20260331093420_initial', NOW(), 1
              WHERE NOT EXISTS (SELECT 1 FROM \"_prisma_migrations\" WHERE migration_name = '20260331093420_initial');
            "
            docker compose exec -T app npx prisma migrate deploy
            # Перезагружаем nginx если конфиг менялся (bind-mount; контейнер сам не перечитывает)
            docker compose exec -T nginx nginx -t && docker compose exec -T nginx nginx -s reload || true
            # Чистим build cache старше 7 дней (иначе диск забивается за неделю)
            docker builder prune -af --filter "until=168h" || true
            echo "Deploy complete: $(date)"

      - name: Health check
        id: healthcheck
        run: |
          # Реальная проверка что сайт отдаёт ответы (а не только SSH-шаги прошли).
          # Ждём до 90 секунд (контейнер может подниматься после миграций).
          start=$(date +%s)
          for i in $(seq 1 18); do
            code=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 10 https://dev.umnayacrm.ru/login || echo "000")
            elapsed=$(( $(date +%s) - start ))
            if [ "$code" = "200" ] || [ "$code" = "307" ] || [ "$code" = "308" ]; then
              echo "Health OK: HTTP $code after ${elapsed}s (попытка $i/18)"
              echo "elapsed=${elapsed}s" >> "$GITHUB_OUTPUT"
              echo "code=$code" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Попытка $i/18: HTTP $code (прошло ${elapsed}s), retry через 5s..."
            sleep 5
          done
          echo "Health check failed после 90s"
          echo "elapsed=90s+" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 1

      # Telegram-уведомления о деплое dev отключены (11.06.2026) — уведомляет
      # только прод-кандидат msk1 (deploy-timeweb.yml). Провал dev-деплоя виден
      # по красному статусу в GitHub Actions.
