name: Billing - block overdue (1st)

on:
  schedule:
    # 1-го числа в 03:30 UTC (06:30 МСК): блокировка организаций
    # с неоплаченными счетами (перед этим хендлер сам сверяет выписку).
    - cron: '30 3 1 * *'
  workflow_dispatch:

jobs:
  block:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger billing-block-overdue
        env:
          CRON_URL: ${{ secrets.CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "CRON_URL / CRON_SECRET не настроены в GitHub Secrets"
            exit 1
          fi
          response=$(curl -sS -w "\n%{http_code}" -X POST "$CRON_URL/api/cron/billing-block-overdue" \
            -H "Authorization: Bearer $CRON_SECRET")
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)
          echo "HTTP $status"
          echo "$body"
          if [ "$status" != "200" ]; then
            exit 1
          fi
