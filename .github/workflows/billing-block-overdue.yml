name: Billing - block overdue (daily)

on:
  schedule:
    # Ежедневно в 00:20 UTC (03:20 МСК): блокировка организаций с неоплаченными
    # (после опроса оплат в 00:00 — не блокируем оплативших ночью). РЕЗЕРВ: supercronic.
    # счетами (dueDate <= сегодня, без грейса). Срок оплаты теперь индивидуален
    # у каждого партнёра (Bug #65), поэтому блокировка проверяется каждый день.
    # Для legacy-партнёров (срок 1-е) поведение не меняется — блок наступает 1-го.
    - cron: '20 0 * * *'
  workflow_dispatch:

jobs:
  block:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger billing-block-overdue
        env:
          CRON_URL: ${{ secrets.CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "CRON_URL / CRON_SECRET не настроены в GitHub Secrets"
            exit 1
          fi
          response=$(curl -sS -w "\n%{http_code}" -X POST "$CRON_URL/api/cron/billing-block-overdue" \
            -H "Authorization: Bearer $CRON_SECRET")
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)
          echo "HTTP $status"
          echo "$body"
          if [ "$status" != "200" ]; then
            exit 1
          fi
