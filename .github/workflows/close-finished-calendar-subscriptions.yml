name: Close finished calendar subscriptions (daily)

on:
  schedule:
    # Ежедневно в 00:06 UTC (= 03:06 МСК). РЕЗЕРВ: supercronic. Закрываем календарные абонементы за
    # прошедшие месяцы, у которых нет долга и все занятия израсходованы.
    # Ежедневно, а не 1-го числа: исправления отметок/долгов задним числом
    # (перерасчёты, уваж. пропуски) делают абонемент завершённым посреди месяца —
    # он не должен висеть активным до следующего 1-го числа. Запуск идемпотентен.
    - cron: '6 0 * * *'
  workflow_dispatch:

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger close-finished-calendar-subscriptions
        env:
          CRON_URL: ${{ secrets.CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "CRON_URL / CRON_SECRET не настроены в GitHub Secrets"
            exit 1
          fi
          response=$(curl -sS -w "\n%{http_code}" -X POST "$CRON_URL/api/cron/close-finished-calendar-subscriptions" \
            -H "Authorization: Bearer $CRON_SECRET")
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)
          echo "HTTP $status"
          echo "$body"
          if [ "$status" != "200" ]; then
            exit 1
          fi
