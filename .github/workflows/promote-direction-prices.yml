name: Promote direction prices (daily)

on:
  schedule:
    # Ежедневно в 00:04 UTC (= 03:04 МСК). РЕЗЕРВ: supercronic. Переносим наступившие версии цены
    # направления (effectiveFrom <= сегодня) в базовые поля направления, чтобы
    # разовое/пробное/отчёты/ЗП сразу считались по новой цене. Идемпотентно.
    - cron: '4 0 * * *'
  workflow_dispatch:

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger promote-direction-prices
        env:
          CRON_URL: ${{ secrets.CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "CRON_URL / CRON_SECRET не настроены в GitHub Secrets"
            exit 1
          fi
          response=$(curl -sS -w "\n%{http_code}" -X POST "$CRON_URL/api/cron/promote-direction-prices" \
            -H "Authorization: Bearer $CRON_SECRET")
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)
          echo "HTTP $status"
          echo "$body"
          if [ "$status" != "200" ]; then
            exit 1
          fi
