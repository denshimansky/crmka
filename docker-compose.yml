services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
      # У msk1 сеть Docker-сборки не резолвит binaries.prisma.sh (EAI_AGAIN), хотя
      # хост резолвит. host-сеть для сборки даёт RUN-шагам рабочий DNS хоста — иначе
      # `prisma generate` падает. На Hetzner это безвредно (там DNS и так рабочий).
      network: host
    restart: unless-stopped
    env_file: .env
    environment:
      # Каталог загрузок базы знаний внутри контейнера (см. том kb-uploads ниже).
      KB_UPLOAD_DIR: /app/uploads
    volumes:
      # Фото статей базы знаний. Именованный том переживает пересборку контейнера
      # (в отличие от файлов внутри образа при output: standalone).
      - kb-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crmka}
      POSTGRES_USER: ${POSTGRES_USER:-crmka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crmka}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - internal

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  # Планировщик кронов (supercronic). Надёжная замена GitHub Actions schedule: на
  # нашей инфре, расписание в git (cron/crontab), едет с приложением через CI на оба
  # сервера. Дёргает эндпоинты /api/cron/* по внутренней сети (app:3000). CRON_SECRET
  # берётся из .env (тот же, что валидирует app); CRON_BASE_URL — адрес app внутри сети.
  cron:
    build:
      context: ./cron
      # host-сеть сборки — как у app: на msk1 Docker-сборка не резолвит DNS (EAI_AGAIN),
      # а тут скачивается бинарь supercronic с github.com.
      network: host
    restart: unless-stopped
    env_file: .env
    environment:
      CRON_BASE_URL: http://app:3000
      TZ: UTC
    depends_on:
      - app
    networks:
      - internal

volumes:
  pgdata:
  certbot-conf:
  certbot-www:
  kb-uploads:

networks:
  internal:
