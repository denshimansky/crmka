<!--
  Иконка расширения CRMka — крупные размеры (48, 128).

  Знак тот же, что у CRM (app/public/favicon.svg): чёрный скруглённый квадрат и
  белая четырёхлучевая искра. Отдельного знака расширению НЕ придумываем
  сознательно: человек ставит его как часть CRMka, и незнакомая иконка в панели
  браузера читалась бы как чужое расширение.

  Отличие от фавиконки CRM — пропорции под тулбар: искра крупнее относительно
  поля (в тулбаре иконка живёт в 16-19 px и мелкий знак там превращается в
  точку), скругление меньше в долях (Chrome сам кадрирует иконку в круг в
  некоторых местах интерфейса — квадрат с малым радиусом переживает это лучше).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="26" fill="#0a0a0a"/>
  <g transform="translate(58,68)" fill="#ffffff">
    <path d="M0-42 C5.6-14 14-5.6 42 0 C14 5.6 5.6 14 0 42 C-5.6 14-14 5.6-42 0 C-14-5.6-5.6-14 0-42Z"/>
  </g>
  <g transform="translate(97,29)" fill="#ffffff" opacity="0.75">
    <path d="M0-15 C2-5 5-2 15 0 C5 2 2 5 0 15 C-2 5-5 2-15 0 C-5-2-2-5 0-15Z"/>
  </g>
</svg>
