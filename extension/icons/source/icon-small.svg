<!--
  Иконка расширения CRMka — мелкие размеры (16, 32).

  Вторая искра здесь УБРАНА, а основная увеличена и отцентрована. Причина
  практическая: в 16 px две фигуры сливаются в серое пятно, и знак перестаёт
  читаться. Это стандартный приём для тулбарных иконок — упрощать силуэт по мере
  уменьшения, а не масштабировать один и тот же файл.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="26" fill="#0a0a0a"/>
  <g transform="translate(64,64)" fill="#ffffff">
    <path d="M0-50 C6.7-16.7 16.7-6.7 50 0 C16.7 6.7 6.7 16.7 0 50 C-6.7 16.7-16.7 6.7-50 0 C-16.7-6.7-6.7-16.7 0-50Z"/>
  </g>
</svg>
