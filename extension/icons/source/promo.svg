<!--
  Малая промо-плитка Chrome Web Store, 440×280.

  Прозрачности здесь быть не должно (требование карточки), поэтому фон
  залит явно. Знак — тот же, что в иконке; подпись набрана системным
  шрифтом.

  ПРО ШРИФТ. Надпись отрисовывается через <text>, а шрифт librsvg внутри sharp
  берёт из системы. Проверено, что на этой машине Arial находится и текст
  выходит; если однажды плитка соберётся без надписи — значит шрифт не нашёлся,
  и лечится это подстановкой другого семейства, а не правкой скрипта.
  Поэтому после каждой перегенерации плитку надо ГЛАЗАМИ посмотреть.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280">
  <rect width="440" height="280" fill="#0a0a0a"/>

  <!-- Знак: та же четырёхлучевая искра, что в иконке расширения. -->
  <g transform="translate(104,148)" fill="#ffffff">
    <path d="M0-56 C7.5-18.7 18.7-7.5 56 0 C18.7 7.5 7.5 18.7 0 56 C-7.5 18.7-18.7 7.5-56 0 C-18.7-7.5-7.5-18.7 0-56Z"/>
  </g>
  <g transform="translate(148,100)" fill="#ffffff" opacity="0.75">
    <path d="M0-17 C2.3-5.7 5.7-2.3 17 0 C5.7 2.3 2.3 5.7 0 17 C-2.3 5.7-5.7 2.3-17 0 C-5.7-2.3-2.3-5.7 0-17Z"/>
  </g>

  <text x="196" y="144" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#ffffff">Умная CRM</text>
  <text x="196" y="176" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#a1a1aa">Карточка клиента</text>
  <text x="196" y="200" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#a1a1aa">рядом с чатом</text>
</svg>
